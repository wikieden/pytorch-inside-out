<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>数值稳定</title><link rel="stylesheet" href="anim.css">
<style>svg text.cap{font-size:15px;font-weight:500}svg text.code{font-family:ui-monospace,Menlo,monospace;font-size:13px}</style></head>
<body><main>
<h1>第 13 章 · logsumexp 与低精度累加</h1>
<p class="sub">配套讲义：<a href="../lessons/13-reduce-matmul.html">第 13 章 · 规约、矩阵乘与数值稳定</a>。</p>
<div class="panel"><svg id="sv" viewBox="0 0 680 400"></svg></div>
<div class="row"><button id="play">▶ 播放</button><button id="step">→ 单步</button><button id="reset">↺ 从头开始</button></div>
<div class="row ctl"><button id="ml">logsumexp</button><button id="mb">bf16 累加</button></div>
<p class="note">看点：① 直接算 e^1000 冲出 float32 上限（约 3.4 × 10^38）；② 减去最大值 1002 后每一项都 ≤ 1；③ bf16 一个个加 1，到 256 就加不动了（256 附近相邻可表示数间隔是 2）。</p>
</main>
<script src="anim.js"></script>
<script>
const sv=$('sv');
let mode='l',k=0,auto=true;
function bf16(x){const b=new Float32Array([x]);const u=new Uint32Array(b.buffer);const r=((u[0]>>16)&1)+0x7fff;u[0]=(u[0]+r)&0xffff0000;return b[0]}
function draw(){
  clear(sv);
  $('ml').classList.toggle('on',mode==='l');$('mb').classList.toggle('on',mode==='b');
  if(mode==='l'){
    const X=[1000,1001,1002];
    const caps=['x = [1000, 1001, 1002]，要算 log(Σ eˣ)','直接算：e^1000 ≈ 10^434，超过 float32 上限 → inf','先提出最大值 M = 1002：x − M = [−2, −1, 0]','e^(x−M) = [0.135, 0.368, 1.000]，都 ≤ 1，求和 1.503','log 1.503 = 0.4076，加回 M：1002.4076 ✓'];
    txt(caps[k],{x:340,y:26,'text-anchor':'middle',class:'cap'},sv);
    const base=300;el('line',{x1:80,y1:base,x2:620,y2:base,stroke:'var(--line)'},sv);
    const lim=120;el('line',{x1:80,y1:lim,x2:620,y2:lim,stroke:'var(--bad)','stroke-dasharray':'5 4'},sv);
    txt('float32 上限 3.4 × 10^38',{x:470,y:lim-6,class:'m'},sv).style.fill='var(--bad)';
    X.forEach((x,i)=>{
      const cx=150+i*170;
      let h=0,lab='',col='var(--accent)';
      if(k===1){h=230;lab='inf';col='var(--bad)'}
      else if(k>=2){const v=Math.exp(x-1002);h=v*160;lab=k>=3?v.toFixed(3):`x−M = ${x-1002}`;col='var(--teal)'}
      if(h>0)el('rect',{x:cx-30,y:base-Math.min(h,240),width:60,height:Math.min(h,240),fill:col,opacity:.85},sv);
      txt(`x = ${x}`,{x:cx,y:base+22,'text-anchor':'middle',class:'code'},sv);
      if(lab)txt(lab,{x:cx,y:base-Math.min(h,240)-8,'text-anchor':'middle',class:'code'},sv);
    });
    if(k>=4){const t=txt('logsumexp = M + log Σ e^(x−M) = 1002 + 0.4076',{x:340,y:360,'text-anchor':'middle',class:'code'},sv);t.style.fill='var(--warm)'}
  }else{
    const N=Math.round(k/6*1000);
    txt(`一个一个加 1：已加 ${N} 次`,{x:340,y:26,'text-anchor':'middle',class:'cap'},sv);
    const px=n=>80+n/1000*540,py=v=>320-v/1000*260;
    el('line',{x1:80,y1:320,x2:620,y2:320,stroke:'var(--line)'},sv);el('line',{x1:80,y1:60,x2:80,y2:320,stroke:'var(--line)'},sv);
    [0,256,500,1000].forEach(v=>txt(v,{x:72,y:py(v)+4,'text-anchor':'end',class:'m'},sv));
    let s32=[],s16=[],s=0;
    for(let n=0;n<=N;n+=4){s32.push(`${px(n)},${py(n)}`)}
    for(let n=0;n<=N;n++){if(n>0)s=bf16(s+1);if(n%4===0)s16.push(`${px(n)},${py(s)}`)}
    if(s32.length>1)el('polyline',{points:s32.join(' '),fill:'none',stroke:'var(--accent)','stroke-width':2},sv);
    if(s16.length>1)el('polyline',{points:s16.join(' '),fill:'none',stroke:'var(--warm)','stroke-width':2.5},sv);
    txt(`float32 累加：${N}`,{x:440,y:90,class:'code'},sv).style.fill='var(--accent)';
    txt(`bf16 累加：${s}`,{x:440,y:112,class:'code'},sv).style.fill='var(--warm)';
    if(N>=256){txt('256 附近 bf16 能表示 …, 254, 256, 258, …',{x:300,y:360,'text-anchor':'middle',class:'m'},sv);txt('256 + 1 = 257 正好在中间，舍入到偶数 → 回到 256',{x:300,y:382,'text-anchor':'middle',class:'m'},sv)}
  }
}
function lim(){return mode==='l'?4:6}
function reset(){k=0;if(auto)mode='l';draw()}
function next(){if(k<lim()){k++;draw();return true}if(auto&&mode==='l'){mode='b';k=0;draw();return true}return false}
$('ml').onclick=()=>{ANIM.stop();auto=false;mode='l';k=0;draw()};
$('mb').onclick=()=>{ANIM.stop();auto=false;mode='b';k=0;draw()};
setupPlayer({captureSeed:1,reset,next},1300);
</script><a href="https://wikieden.github.io/ai-books/" style="position:fixed;right:12px;bottom:12px;z-index:99;padding:4px 10px;border-radius:14px;background:rgba(127,127,127,.18);color:inherit;font:13px/1.6 system-ui,sans-serif;text-decoration:none">← 全部讲义书</a>
</body></html>
