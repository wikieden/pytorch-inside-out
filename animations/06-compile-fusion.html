<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>eager vs compile</title><link rel="stylesheet" href="anim.css">
<style>svg text.cap{font-size:15px;font-weight:500}svg text.code{font-family:ui-monospace,Menlo,monospace;font-size:13px}svg text.big{font-size:14px;font-weight:500}</style></head>
<body><main>
<h1>第 6 章 · eager 与 compile：kernel 数和显存往返</h1>
<p class="sub">配套讲义：<a href="../lessons/06-compile-stack.html">第 6 章 · eager 与 graph：torch.compile 里面的三道工序</a>。y = (x.sin().cos() × 2).sum(-1)。</p>
<div class="panel"><svg id="sv" viewBox="0 0 680 400"></svg></div>
<div class="row"><button id="play">▶ 播放</button><button id="step">→ 单步</button><button id="reset">↺ 从头开始</button></div>
<div class="row ctl"><button id="tm"></button><button id="tb"></button></div>
<p class="note">看点：① eager 每个算子一个 kernel，中间结果 t1、t2、t3 写进显存再读出来；② compile 把四个算子合成一个 kernel，只读 x、只写 y；③ 中间插一个依赖张量值的 if，图被切成两段，中间结果要落一次显存。</p>
</main>
<script src="anim.js"></script>
<script>
const sv=$('sv');
let mode=0,brk=false,k=0; // mode 0 = 自动演示 eager 后 compile; 由按钮锁定
let lock=null;
const OPS=['sin','cos','× 2','sum'];
const VARS=['x','t1','t2','t3','y'];
function groups(m){ // returns list of [startOp,endOp]
  if(m==='eager')return [[0,0],[1,1],[2,2],[3,3]];
  return brk?[[0,0],[1,3]]:[[0,3]];
}
function cur(){return lock||(k<=4?'eager':'compile')}
function draw(){
  clear(sv);
  const m=cur(),G=groups(m),sub=lock?k:(k<=4?k:k-4);
  const OX=i=>110+i*140;
  txt(m==='eager'?'eager：每个算子一个 kernel':brk?'compile + 断图：if y.sum() > 0 把图切成两段':'compile：Inductor 把四个算子融合成一个 kernel',{x:340,y:26,'text-anchor':'middle',class:'cap'},sv);
  // ops
  OPS.forEach((o,i)=>{
    el('rect',{x:OX(i)-40,y:60,width:80,height:36,rx:8,fill:'var(--bg)',stroke:'var(--line)'},sv);
    txt(o,{x:OX(i),y:83,'text-anchor':'middle',class:'big'},sv);
    if(i<3)el('line',{x1:OX(i)+40,y1:78,x2:OX(i+1)-40,y2:78,stroke:'var(--line)'},sv);
  });
  if(brk&&m!=='eager'){const t=txt('if y.sum() > 0 ✂',{x:(OX(0)+OX(1))/2,y:52,'text-anchor':'middle',class:'m'},sv);t.style.fill='var(--bad)'}
  // kernel boxes
  G.forEach((g,gi)=>{
    const on=gi<sub;
    const x0=OX(g[0])-50,x1=OX(g[1])+50;
    el('rect',{x:x0,y:110,width:x1-x0,height:40,rx:8,fill:on?'var(--accent-bg)':'var(--card)',stroke:on?'var(--accent)':'var(--line)','stroke-width':on?2:1},sv);
    txt(`kernel ${gi+1}`,{x:(x0+x1)/2,y:135,'text-anchor':'middle',class:'big'},sv);
  });
  // memory row
  txt('显存',{x:40,y:272,class:'big'},sv);
  const MX=i=>40+i*140+30;
  const used=new Set();G.forEach(g=>{used.add(g[0]);used.add(g[1]+1)});
  VARS.forEach((v,i)=>{
    const live=used.has(i);
    const r=el('rect',{x:MX(i)-30,y:280,width:60,height:34,rx:6,fill:live?'var(--bg)':'var(--card)',stroke:live?'var(--line)':'var(--card)','stroke-dasharray':live?'':'4 3'},sv);
    const t=txt(v,{x:MX(i),y:302,'text-anchor':'middle',class:'code'},sv);
    if(!live){t.setAttribute('opacity','.35')}
  });
  let rd=0,wr=0;
  G.forEach((g,gi)=>{
    if(gi>=sub)return;
    const kc=(OX(g[0])+OX(g[1]))/2;
    const a=MX(g[0]),b=MX(g[1]+1);
    el('line',{x1:a,y1:280,x2:kc-10,y2:150,stroke:'var(--teal)','stroke-width':2},sv);
    el('line',{x1:kc+10,y1:150,x2:b,y2:280,stroke:'var(--warm)','stroke-width':2},sv);
    rd++;wr++;
  });
  const L=txt('■ 读',{x:420,y:350,class:'m'},sv);L.style.fill='var(--teal)';
  const W=txt('■ 写',{x:470,y:350,class:'m'},sv);W.style.fill='var(--warm)';
  txt(`kernel 数 ${G.length}　显存读写 ${rd+wr} 趟（已画 ${sub} 个 kernel）`,{x:40,y:350,class:'big'},sv);
  txt('每趟读或写一整个张量；逐元素运算的时间几乎都花在这些箭头上',{x:40,y:378,class:'m'},sv);
  $('tm').textContent='模式：'+(lock?lock:'自动（先 eager 再 compile）');
  $('tb').textContent='中间加 if（断图）：'+(brk?'开':'关');
}
function total(){return lock?groups(lock).length:4+groups('compile').length}
function reset(){k=0;draw()}
function next(){if(k>=total())return false;k++;draw();return true}
$('tm').onclick=()=>{ANIM.stop();lock=lock===null?'eager':lock==='eager'?'compile':null;k=0;draw()};
$('tb').onclick=()=>{ANIM.stop();brk=!brk;k=0;draw()};
setupPlayer({captureSeed:1,reset,next},1300);
</script></body></html>
